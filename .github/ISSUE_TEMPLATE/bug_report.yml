name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `szq doctor`
      render: text
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (if a hook is involved)
      placeholder: e.g. Claude Code 2.x, Codex CLI 0.x, Cursor 1.x
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or a tiny repository. Please redact secrets from any output.
